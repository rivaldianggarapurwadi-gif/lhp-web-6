<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceko -- Admin</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --void: #000000;
    --bone: #ffffff;
    --ash: #9a9a9a;
    --silver: #bdbdbd;
    --iris: #8052ff;
    --iris-dim: #6a3ff0;
    --saffron: #ffb829;
    --hairline: rgba(255,255,255,.10);
    --hairline-soft: rgba(255,255,255,.06);
    --danger: #ff6b6b;
    --ok: #3ddc84;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); font-weight: 400; font-size: 15px; line-height: 1.5;
    background: var(--void); color: var(--bone);
  }

  .topbar {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
    border-bottom: 1px solid var(--hairline-soft);
  }
  .brand { font-weight: 400; font-size: 20px; letter-spacing: -0.02em; color: var(--bone); }
  .badge-mark {
    font-family: ui-monospace, "SF Mono", monospace; font-weight: 700; font-size: 11px;
    letter-spacing: .1em; color: var(--void); background: var(--iris);
    border-radius: 999px; padding: 3px 10px;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #444; flex-shrink: 0; }
  .status-dot.ok { background: var(--ok); }
  .status-dot.bad { background: var(--danger); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .whoami { font-size: 13px; color: var(--ash); }
  .ghost-link { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .025em; color: var(--ash); text-decoration: none; }
  .ghost-link:hover { color: var(--bone); }

  main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
  .hint { color: var(--ash); font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
  .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .025em; color: var(--ash); margin: 0 0 18px; }
  section { margin-bottom: 56px; }

  input, select {
    font-family: var(--font); font-size: 14px; font-weight: 400; color: var(--bone);
    background: transparent; border: none; border-bottom: 1px solid var(--hairline);
    border-radius: 0; padding: 9px 4px; outline: none;
  }
  input::placeholder { color: var(--ash); }
  input:focus, select:focus { border-bottom-color: var(--iris); }
  select { padding: 9px 2px; }
  select option { background: #111; color: var(--bone); }

  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

  .btn-primary {
    font-family: var(--font); font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .025em; color: var(--bone); background: var(--iris);
    border: none; border-radius: 999px; padding: 11px 22px; cursor: pointer;
  }
  .btn-primary:hover:not(:disabled) { background: var(--iris-dim); }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  .ghost-btn-sm {
    font-family: var(--font); font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .02em; color: var(--ash); background: transparent;
    border: 1px solid var(--hairline); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .ghost-btn-sm:hover:not(:disabled) { color: var(--bone); border-color: rgba(255,255,255,.28); }
  .ghost-btn-sm:disabled { opacity: .5; cursor: default; }
  .ghost-btn-sm.danger { color: var(--danger); border-color: rgba(255,107,107,.35); }
  .ghost-btn-sm.danger:hover:not(:disabled) { border-color: var(--danger); }

  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 1em; }
  .ok-msg { color: var(--ok); font-size: 13px; margin-top: 8px; min-height: 1em; }
  .tag-pill {
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--silver);
    background: rgba(255,255,255,.06); border-radius: 999px; padding: 2px 8px; letter-spacing: .05em;
  }

  #login-box {
    min-height: calc(100vh - 65px); display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(600px 400px at 50% 0%, rgba(128,82,255,.14), transparent 70%);
  }
  .login-card { width: 100%; max-width: 340px; }
  .login-card .brand { font-size: 40px; letter-spacing: -0.02em; margin-bottom: 6px; }
  .login-tagline { font-weight: 200; font-size: 16px; color: var(--silver); margin: 0 0 32px; }
  .field { margin-bottom: 18px; }
  #login-tag { text-transform: uppercase; letter-spacing: .06em; width: 100%; }
  #login-password { width: 100%; }
  .login-card .btn-primary { width: 100%; padding: 14px 28px; font-size: 14px; }

  #app { display: none; }

  .created-note {
    margin-top: 16px; padding: 14px 16px; background: rgba(61,220,132,.08);
    border: 1px solid rgba(61,220,132,.25); border-radius: 12px; font-size: 13px; color: var(--silver);
  }
  .created-note b { color: var(--ok); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--hairline-soft); vertical-align: middle; }
  th { color: var(--ash); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  td input.username-edit {
    width: 140px; padding: 6px 4px; font-size: 13px; border-bottom: 1px solid var(--hairline);
  }
  .status-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px; border: 1px solid;
  }
  .badge.admin { color: var(--iris); border-color: rgba(128,82,255,.4); }
  .badge.disabled { color: var(--danger); border-color: rgba(255,107,107,.4); }
  .badge.active { color: var(--ok); border-color: rgba(61,220,132,.4); }
  .badge.taruna { color: var(--saffron); border-color: rgba(255,184,41,.4); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>

<header class="topbar">
  <span class="status-dot" id="status-dot"></span>
  <span class="brand">Ceko</span>
  <span class="badge-mark">ADMIN</span>
  <span id="instance-name" style="display:none"></span>
  <div class="topbar-right">
    <a href="/" class="ghost-link">&larr; Aplikasi</a>
    <span id="whoami" class="whoami"></span>
    <button id="logout-btn" class="ghost-btn-sm" style="display:none">Keluar</button>
  </div>
</header>

<section id="login-box">
  <div class="login-card">
    <div class="brand">Ceko</div>
    <p class="login-tagline">Masuk sebagai admin.</p>
    <div class="field">
      <input id="login-tag" placeholder="TAG" maxlength="6" autocomplete="off">
    </div>
    <div class="field">
      <input id="login-password" placeholder="Kata sandi" type="password">
    </div>
    <button id="login-btn" class="btn-primary">Masuk</button>
    <div class="error" id="login-error"></div>
  </div>
</section>

<div id="app">
  <main>
    <section>
      <p class="section-title">Buat akun</p>
      <div class="row">
        <input id="create-username" placeholder="username">
        <input id="create-password" placeholder="kata sandi (kosongkan = otomatis)" type="text">
        <select id="create-kind">
          <option value="ceko">Ceko</option>
          <option value="taruna">Taruna</option>
        </select>
        <button id="create-btn" class="btn-primary">Buat</button>
      </div>
      <div class="error" id="create-error"></div>
      <div id="create-result"></div>
    </section>

    <section>
      <p class="section-title">Akun</p>
      <div class="row">
        <input id="search-box" placeholder="cari username atau tag" style="width:220px">
        <button id="search-btn" class="ghost-btn-sm">Cari</button>
        <button id="refresh-btn" class="ghost-btn-sm">Muat ulang</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Tag</th><th>Username</th><th>Status</th><th>Dibuat</th><th>Aksi</th></tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
      <div class="error" id="list-error"></div>
    </section>
  </main>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let accessToken = null, me = null;

  fetch("/health").then((r) => r.json()).then((d) => {
    $("instance-name").textContent = d.instance;
    $("status-dot").classList.add("ok");
  }).catch(() => {
    $("instance-name").textContent = "unreachable";
    $("status-dot").classList.add("bad");
  });

  async function api(path, opts = {}, isRetry = false) {
    const headers = { "content-type": "application/json", ...(opts.headers || {}) };
    if (accessToken) headers.authorization = "Bearer " + accessToken;
    const res = await fetch(path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) {
      // Same fix as index.html: the access token is short-lived and nothing
      // refreshed it proactively, so an admin tab left open for a while
      // turned every action into "Invalid or expired token". Refresh once
      // and retry transparently instead.
      if (res.status === 401 && !isRetry && path !== "/auth/refresh" && path !== "/auth/login") {
        try {
          const refreshed = await api("/auth/refresh", { method: "POST" }, true);
          accessToken = refreshed.accessToken;
          return api(path, opts, true);
        } catch {
          // Refresh itself failed -- the session is genuinely over.
        }
      }
      throw new Error((data && data.error && data.error.message) || res.statusText);
    }
    return data;
  }

  // Admins are Ceko accounts too -- same persistent-session restore as
  // index.html. See there for why this is hidden until we know the result.
  $("login-box").style.display = "none";
  (async () => {
    try {
      const data = await api("/auth/refresh", { method: "POST" });
      if (!data.user || !data.user.isAdmin) throw new Error("tidak ada sesi admin");
      accessToken = data.accessToken;
      me = data.user;
      onLoggedIn();
    } catch {
      $("login-box").style.display = "flex";
    }
  })();

  $("login-btn").onclick = async () => {
    $("login-error").textContent = "";
    try {
      const tag = $("login-tag").value.trim().toUpperCase();
      const password = $("login-password").value;
      const data = await api("/auth/login", { method: "POST", body: { tag, password } });
      if (!data.user.isAdmin) throw new Error("Akun itu bukan admin.");
      accessToken = data.accessToken;
      me = data.user;
      onLoggedIn();
    } catch (e) {
      $("login-error").textContent = e.message;
    }
  };
  $("login-password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("login-btn").click();
  });

  $("logout-btn").onclick = async () => {
    try { await api("/auth/logout", { method: "POST" }); } catch {}
    location.reload();
  };

  function onLoggedIn() {
    $("login-box").style.display = "none";
    $("app").style.display = "block";
    $("logout-btn").style.display = "inline-block";
    $("whoami").innerHTML = me.username + " <span class='tag-pill'>" + me.tag + "</span>";
    loadUsers();
  }

  $("create-btn").onclick = async () => {
    $("create-error").textContent = "";
    $("create-result").innerHTML = "";
    try {
      const username = $("create-username").value.trim();
      const password = $("create-password").value;
      const accountKind = $("create-kind").value;
      const data = await api("/admin/users", {
        method: "POST",
        body: { username, password: password || undefined, accountKind },
      });
      $("create-username").value = "";
      $("create-password").value = "";
      const passLine = data.generatedPassword
        ? "kata sandi otomatis: <b>" + data.generatedPassword + "</b> (hanya ditampilkan sekali)"
        : "kata sandi diset sesuai yang dimasukkan";
      $("create-result").innerHTML =
        "<div class='created-note'>Berhasil membuat <b>" + escapeHtml(data.user.username) +
        "</b> -- tag <span class='tag-pill'>" + data.user.tag + "</span><br>" + passLine + "</div>";
      loadUsers();
    } catch (e) {
      $("create-error").textContent = e.message;
    }
  };

  $("search-btn").onclick = () => loadUsers();
  $("refresh-btn").onclick = () => loadUsers();
  $("search-box").addEventListener("keydown", (e) => { if (e.key === "Enter") loadUsers(); });

  async function loadUsers() {
    $("list-error").textContent = "";
    try {
      const q = $("search-box").value.trim();
      const data = await api("/admin/users" + (q ? "?q=" + encodeURIComponent(q) : ""));
      renderUsers(data.users);
    } catch (e) {
      $("list-error").textContent = e.message;
    }
  }

  function renderUsers(users) {
    const tbody = $("user-rows");
    tbody.innerHTML = "";
    for (const u of users) {
      const tr = document.createElement("tr");

      const tagTd = document.createElement("td");
      tagTd.innerHTML = "<span class='tag-pill'>" + u.tag + "</span>";
      tr.appendChild(tagTd);

      const nameTd = document.createElement("td");
      const nameInput = document.createElement("input");
      nameInput.className = "username-edit";
      nameInput.value = u.username;
      nameTd.appendChild(nameInput);
      tr.appendChild(nameTd);

      const statusTd = document.createElement("td");
      statusTd.innerHTML = "<div class='status-badges'>" +
        (u.disabled_at ? "<span class='badge disabled'>nonaktif</span>" : "<span class='badge active'>aktif</span>") +
        (u.is_admin ? " <span class='badge admin'>admin</span>" : "") +
        (u.account_kind === "taruna" ? " <span class='badge taruna'>taruna</span>" : "") +
        "</div>";
      tr.appendChild(statusTd);

      const createdTd = document.createElement("td");
      createdTd.textContent = new Date(u.created_at).toLocaleDateString();
      tr.appendChild(createdTd);

      const actionsTd = document.createElement("td");
      actionsTd.className = "actions";

      const saveBtn = actionButton("Simpan nama", "", async () => {
        await patchUser(u.id, { username: nameInput.value.trim() });
      });
      actionsTd.appendChild(saveBtn);

      const toggleDisabled = actionButton(
        u.disabled_at ? "Aktifkan" : "Nonaktifkan",
        u.disabled_at ? "" : "danger",
        async () => { await patchUser(u.id, { disabled: !u.disabled_at }); }
      );
      actionsTd.appendChild(toggleDisabled);

      const toggleAdmin = actionButton(
        u.is_admin ? "Cabut admin" : "Jadikan admin",
        "",
        async () => { await patchUser(u.id, { isAdmin: !u.is_admin }); }
      );
      actionsTd.appendChild(toggleAdmin);

      const toggleKind = actionButton(
        u.account_kind === "taruna" ? "Jadikan Ceko" : "Jadikan Taruna",
        "",
        async () => { await patchUser(u.id, { accountKind: u.account_kind === "taruna" ? "ceko" : "taruna" }); }
      );
      actionsTd.appendChild(toggleKind);

      const resetBtn = actionButton("Reset kata sandi", "", async () => {
        const newPassword = crypto.randomUUID().replace(/-/g, "").slice(0, 16);
        await patchUser(u.id, { newPassword });
        alert("Kata sandi baru untuk " + u.username + ": " + newPassword + "\n(hanya ditampilkan sekali)");
      });
      actionsTd.appendChild(resetBtn);

      tr.appendChild(actionsTd);
      tbody.appendChild(tr);
    }
  }

  function actionButton(label, extraClass, onClick) {
    const btn = document.createElement("button");
    btn.className = "ghost-btn-sm" + (extraClass ? " " + extraClass : "");
    btn.textContent = label;
    btn.onclick = async () => {
      btn.disabled = true;
      $("list-error").textContent = "";
      try {
        await onClick();
        await loadUsers();
      } catch (e) {
        $("list-error").textContent = e.message;
        btn.disabled = false;
      }
    };
    return btn;
  }

  function patchUser(id, body) {
    return api("/admin/users/" + id, { method: "PATCH", body });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
})();
</script>
</body>
</html>
