services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ceko
      POSTGRES_PASSWORD: ceko
      POSTGRES_DB: ceko
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceko"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "dist/src/migrate.js"]
    environment:
      DATABASE_URL: postgres://ceko:ceko@postgres:5432/ceko
    depends_on:
      postgres: { condition: service_healthy }

  # Two instances on purpose. A single instance cannot exercise the Redis
  # fan-out, which is where the interesting bugs live.
  api-1:
    build: .
    environment:
      DATABASE_URL: postgres://ceko:ceko@postgres:5432/ceko
      REDIS_URL: redis://redis:6379
      JWT_SECRET: e2e-secret
      PORT: 3001
      INSTANCE_ID: api-1
      # Handed back in presigned upload URLs -- must be reachable from
      # wherever the test suite runs (the host), not the container's own view
      # of itself.
      PUBLIC_URL: http://localhost:3001
    ports: ["3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api-2:
    build: .
    environment:
      DATABASE_URL: postgres://ceko:ceko@postgres:5432/ceko
      REDIS_URL: redis://redis:6379
      JWT_SECRET: e2e-secret
      PORT: 3002
      INSTANCE_ID: api-2
      PUBLIC_URL: http://localhost:3002
    ports: ["3002:3002"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
