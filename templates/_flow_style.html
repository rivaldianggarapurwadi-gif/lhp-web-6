<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#1d1d1f;--deep-gray:#474747;--mid-gray:#707070;--hairline:#d6d6d6;
        --cool-wash:#e8e8ed;--canvas:#f5f5f7;--paper:#fff;
        --blue:#0071e3;--blue-hover:#0077ed;--link:#0066cc;--ember:#b64400;--green:#1d7f4c;
        --font-display:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
        --font-text:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif}
  html{-webkit-font-smoothing:antialiased}
  body{font-family:var(--font-text);background:var(--canvas);color:var(--ink);
       font-size:17px;line-height:1.47;letter-spacing:-.022em;min-height:100vh}
  header{position:sticky;top:0;z-index:60;height:52px;background:rgba(250,250,252,.97);
         border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;padding:0 20px;gap:12px}
  header img{width:26px;height:26px;object-fit:contain}
  header .t{font-family:var(--font-display);font-size:15px;font-weight:600;white-space:nowrap}
  header .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px}
  header a{color:var(--deep-gray);text-decoration:none;white-space:nowrap}
  header a:hover{color:var(--ink)}
  .pill{background:var(--cool-wash);border-radius:980px;padding:5px 12px;white-space:nowrap}
  main{max-width:760px;margin:0 auto;padding:36px 20px 80px}
  .steps{font-size:12px;color:var(--mid-gray);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  h1{font-family:var(--font-display);font-size:34px;font-weight:600;letter-spacing:.003em;line-height:1.15}
  .lede{color:var(--mid-gray);margin:10px 0 28px}
  .card{background:var(--paper);border-radius:28px;padding:30px 30px 32px;margin-bottom:20px}
  .card h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:4px}
  .card .sub{font-size:14px;color:var(--mid-gray);margin-bottom:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.card{padding:24px 20px}h1{font-size:28px}}
  .field{display:flex;flex-direction:column;gap:7px;min-width:0}
  .field label{font-size:14px;color:var(--mid-gray)}
  .field input,.field select{width:100%;border:1px solid var(--hairline);border-radius:12px;padding:12px 14px;
       font-family:var(--font-text);font-size:17px;color:var(--ink);background:var(--paper)}
  .field input[type=text]{text-transform:uppercase}
  .field input::placeholder{text-transform:none}
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.12)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;
       border:none;border-radius:980px;padding:13px 28px;font-family:var(--font-text);font-size:17px;
       cursor:pointer;text-decoration:none;transition:background .2s}
  .btn:hover{background:var(--blue-hover)}
  .btn:disabled{background:var(--cool-wash);color:var(--mid-gray);cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(0,0,0,.22)}
  .btn-ghost:hover{background:var(--cool-wash)}
  .msg{font-size:14px;min-height:20px;margin-top:12px}
  .msg.ok{color:var(--green)} .msg.err{color:var(--ember)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
